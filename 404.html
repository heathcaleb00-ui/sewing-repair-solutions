<style>
/* Layout: repair-shop ticket. Stitch-line dividers, a tape-measure rule under the hero,
   service cards cut like hang tags, a real 4-step pickup sequence, contact as a work order. */
:root{
  /* Original brand colors: mauve #A4798D, blue #2B5672, white, black */
  --bg:#FFFFFF; --surface:#FBF8F9; --ink:#141820; --muted:#555B66;
  --line:#E3D9DE; --accent:#2B5672; --accent-ink:#FFFFFF; --thread:#8A5F73; --mauve:#A4798D; --tag:#F5EDF1;
  /* Type: Gloock (vintage pattern-envelope serif), Schibsted Grotesk (body),
     Courier Prime (typewritten repair tickets), Reenie Beanie (technician's handwriting) */
  --display:"Gloock", "Bodoni 72", Didot, Georgia, serif;
  --body:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono:"Courier Prime", "Courier New", Courier, monospace;
  --hand:"Reenie Beanie", "Bradley Hand", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181F; --surface:#1D2129; --ink:#EEF0F4; --muted:#A9AEB9;
  --line:#353A46; --accent:#7FAFD0; --accent-ink:#0E1A24; --thread:#D3AFC0; --mauve:#C29AAD; --tag:#2A2228; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181F; --surface:#1D2129; --ink:#EEF0F4; --muted:#A9AEB9;
  --line:#353A46; --accent:#7FAFD0; --accent-ink:#0E1A24; --thread:#D3AFC0; --mauve:#C29AAD; --tag:#2A2228; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:80px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;letter-spacing:.005em;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--thread);outline-offset:3px;border-radius:4px}
.eyebrow{font:700 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--thread)}
.stitch{height:0;border:0;border-top:2px dashed var(--line);margin:0}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{flex:none}
.brand b{font:400 20px/1 var(--display)}
.links{display:flex;gap:22px;align-items:center;font-weight:600;font-size:15px}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;padding:12px 20px;border-radius:999px;font-size:16px;border:0;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.links .btn{color:var(--accent-ink);padding:9px 16px;font-size:15px}
@media (max-width:760px){.links a:not(.btn){display:none}}

/* Hero */
.hero{padding-block:72px 0}
.hero-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(40px,6.4vw,76px);margin-top:16px}
.hero h1 em{font-style:normal;color:var(--mauve)}
.hero .lede{font-size:19px;color:var(--muted);max-width:34em;margin-top:22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.free{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;position:relative}
.free::after{content:"";position:absolute;inset:10px;border:2px dashed var(--line);border-radius:12px;pointer-events:none}
.free .big{font:400 clamp(30px,3.6vw,42px)/1.05 var(--display)}
.free .big span{color:var(--thread)}
.free ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.free li{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.free li svg{flex:none;margin-top:4px}
.tape{margin-top:64px;height:44px;border-block:1px solid var(--line);background:
  repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 100%) 0 0/96px 22px no-repeat,
  repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px) 0 0/100% 10px no-repeat,
  repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 48px) 0 0/100% 16px no-repeat,
  repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 96px) 0 0/100% 26px no-repeat,
  var(--tag)}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero{padding-block:44px 0}}

/* Sections */
section{padding-block:88px}
.head{display:grid;gap:14px;max-width:44em;margin-bottom:44px}
.head h2{font-size:clamp(32px,4.4vw,52px)}
.head p{color:var(--muted);font-size:18px}

/* Mission */
.mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.mission-grid .copy{display:grid;gap:18px;font-size:18px}
.machines{display:grid;gap:0;border-top:2px dashed var(--line)}
.machines div{display:flex;justify-content:space-between;gap:16px;padding-block:16px;border-bottom:2px dashed var(--line);font-weight:600}
.machines div span{font:700 14px/1.6 var(--mono);color:var(--thread);white-space:nowrap}
@media (max-width:860px){.mission-grid{grid-template-columns:1fr;gap:32px}}

/* Services: hang tags */
#services{background:var(--surface);border-block:1px solid var(--line)}
.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tag{background:var(--tag);border-radius:6px 6px 14px 14px;padding:34px 26px 28px;position:relative;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:14px;min-width:0;
  clip-path:polygon(16% 0,84% 0,100% 7%,100% 100%,0 100%,0 7%)}
.tag .hole{position:absolute;top:14px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.tag .no{font:700 13px/1 var(--mono);letter-spacing:.12em;color:var(--muted);margin-top:10px}
.tag h3{font-size:28px}
.tag ul{margin:0;padding:0;list-style:none;display:grid;gap:9px;font-size:15.5px}
.tag li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.tag li::before{content:"";width:12px;height:12px;margin-top:6px;border:2px solid var(--thread);border-radius:3px}
.tag .note{border-top:2px dashed var(--line);padding-top:14px;font:400 27px/1.05 var(--hand);color:var(--ink)}
.tag .note b{font-weight:400;color:var(--thread)}
@media (max-width:960px){.tags{grid-template-columns:1fr;max-width:560px}}
.all{margin-top:36px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;color:var(--muted);font-weight:600}
.all .chip{font:700 13px/1 var(--mono);letter-spacing:.06em;padding:9px 12px;border-radius:999px;border:1.5px solid var(--thread);color:var(--thread)}

/* Process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:s;position:relative}
.steps::before{content:"";position:absolute;left:0;right:0;top:27px;border-top:2px dashed var(--line)}
.step{position:relative;padding-right:24px;display:grid;gap:10px;align-content:start}
.step .dot{width:56px;height:56px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);display:grid;place-items:center;font:400 22px/1 var(--display)}
.step:last-child .dot{background:var(--mauve);border-color:var(--mauve);color:#fff}
.step h3{font-size:22px;margin-top:6px}
.step p{color:var(--muted);font-size:16px}
@media (max-width:860px){.steps{grid-template-columns:1fr;gap:28px}.steps::before{left:27px;right:auto;top:0;bottom:0;border-top:0;border-left:2px dashed var(--line)}
  .step{grid-template-columns:56px 1fr;column-gap:18px;padding-right:0}.step .dot{grid-row:span 2}.step h3{margin-top:12px}}

/* Contact */
#contact{background:#2B5672;color:#fff;--bg:#fff;--ink:#2B5672}
#contact .eyebrow{color:var(--mauve)}
#contact .head p{color:color-mix(in srgb,var(--bg) 75%,var(--ink))}
.order{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.75fr) minmax(0,1.05fr);gap:0;border:2px dashed color-mix(in srgb,var(--bg) 30%,var(--ink));border-radius:14px}
.field{padding:26px;display:grid;gap:10px;align-content:start;min-width:0}
.field + .field{border-left:2px dashed color-mix(in srgb,var(--bg) 30%,var(--ink))}
.field .lab{font:700 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--bg) 82%,var(--ink))}
.field .val{font:400 clamp(20px,2.2vw,26px)/1.25 var(--display);overflow-wrap:anywhere;user-select:all}
.field .val a{text-decoration:none}
.field .val.email{font:600 clamp(18px,1.85vw,23px)/1.3 var(--body);letter-spacing:.005em;overflow-wrap:normal;word-break:normal}
.field .val.email a{border-bottom:2px solid color-mix(in srgb,var(--bg) 35%,var(--ink));padding-bottom:2px}
.field .val.email a:hover{border-bottom-color:var(--bg)}
.copy-btn{justify-self:start;background:transparent;color:var(--bg);border:1.5px solid color-mix(in srgb,var(--bg) 40%,var(--ink));border-radius:999px;padding:6px 14px;font:600 13px/1 var(--body);cursor:pointer}
.copy-btn:hover{border-color:var(--bg)}
@media (max-width:1000px){.order{grid-template-columns:1fr}.field + .field{border-left:0;border-top:2px dashed color-mix(in srgb,var(--bg) 30%,var(--ink))}}
.contact-cta{margin-top:36px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.contact-cta .btn.ghost{color:var(--bg);border-color:var(--bg)}
.contact-cta .btn:not(.ghost){background:#fff;color:#2B5672;border:2px solid #fff}

footer{--bg:#fff;--ink:#1F4058;background:#1F4058;color:color-mix(in srgb,var(--bg) 60%,var(--ink));font-size:14px}
footer .wrap{padding-block:26px;border-top:1px solid color-mix(in srgb,var(--bg) 18%,var(--ink));display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer a{color:var(--bg)}
img{max-width:100%;height:auto;display:block}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.hero-photo{border-radius:14px;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--tag)}
.free{padding:16px 16px 26px}
.free > :not(img){padding-inline:12px}
.mission-photo{margin-top:28px;border-radius:14px;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--tag)}
.tag img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:var(--surface)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gallery a{display:block;border-radius:10px;overflow:hidden;background:var(--tag)}
.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;transition:transform .3s}
.gallery a:hover img{transform:scale(1.04)}
@media (prefers-reduced-motion:reduce){.gallery img{transition:none}}
@media (max-width:700px){.gallery{grid-template-columns:repeat(2,1fr);gap:10px}}

/* Service tag hover: tag swings from its hole on a thread, checklist ticks off, stitch line sews across */
.tag-hang .tag{height:100%}
.tag-hang{position:relative;transform-origin:50% 21px;transition:filter .3s ease, opacity .3s ease;filter:drop-shadow(0 0 0 transparent)}
.tag-hang::before{content:"";position:absolute;left:50%;top:-30px;width:2px;height:51px;margin-left:-1px;background:var(--thread);transform:scaleY(0);transform-origin:top;transition:transform .35s ease;z-index:1;border-radius:2px}
.tag li{position:relative}
.tag li::before{transition:background-color .25s ease, border-color .25s ease}
.tag li::after{content:"";position:absolute;left:4px;top:7px;width:4px;height:7px;border:solid var(--tag);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .25s ease}
.tag .note{position:relative;border-top-color:var(--line)}
.tag .note::before{content:"";position:absolute;left:0;top:-2px;height:0;width:0;border-top:2px dashed var(--thread);transition:width .7s steps(14)}
.tag img{transition:filter .4s ease}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  .tag-hang:hover{animation:swing 1.1s ease-out both;filter:drop-shadow(0 18px 22px rgba(43,86,114,.22))}
  .tag-hang:hover::before{transform:scaleY(1)}
  .tags:hover .tag-hang:not(:hover){opacity:.7}
  .tag-hang:hover li::before{background:var(--thread);border-color:var(--thread)}
  .tag-hang:hover li::after{transform:rotate(45deg) scale(1)}
  .tag-hang:hover .note::before{width:100%}
  .tag-hang:hover img{filter:saturate(1.15) contrast(1.05)}
  .tag-hang:hover li:nth-child(1)::before,.tag-hang:hover li:nth-child(1)::after{transition-delay:.10s}
  .tag-hang:hover li:nth-child(2)::before,.tag-hang:hover li:nth-child(2)::after{transition-delay:.18s}
  .tag-hang:hover li:nth-child(3)::before,.tag-hang:hover li:nth-child(3)::after{transition-delay:.26s}
  .tag-hang:hover li:nth-child(4)::before,.tag-hang:hover li:nth-child(4)::after{transition-delay:.34s}
  .tag-hang:hover li:nth-child(5)::before,.tag-hang:hover li:nth-child(5)::after{transition-delay:.42s}
  .tag-hang:hover li:nth-child(6)::before,.tag-hang:hover li:nth-child(6)::after{transition-delay:.50s}
}
@keyframes swing{
  0%{transform:translateY(0) rotate(0)}
  20%{transform:translateY(-10px) rotate(-3deg)}
  45%{transform:translateY(-10px) rotate(2deg)}
  70%{transform:translateY(-10px) rotate(-1deg)}
  100%{transform:translateY(-10px) rotate(0)}
}
@media (prefers-reduced-motion:reduce){.tag-hang:hover{filter:drop-shadow(0 12px 16px rgba(43,86,114,.2))}}

/* ---------- Responsive + device tuning ---------- */
.nav{min-height:68px;padding-block:12px}
.brand b{white-space:nowrap}
.btn{white-space:nowrap}
.call svg{flex:none}
.call-short{display:none}
.menu-btn{display:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;padding:0;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menu-btn span{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink);transition:transform .2s ease, opacity .2s ease}
.menu-btn[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-btn[aria-expanded="true"] span:nth-child(2){opacity:0}
.menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{border-top:1px solid var(--line);background:var(--surface)}
.mobile-menu .wrap{display:grid;padding-block:6px 12px}
.mobile-menu a{display:flex;align-items:center;min-height:48px;font:600 18px/1 var(--body);text-decoration:none;border-bottom:2px dashed var(--line)}
.mobile-menu a:last-child{border-bottom:0}
@media (min-width:901px){.mobile-menu{display:none!important}}

/* tablets and below: links move into the menu */
@media (max-width:900px){
  .links{gap:10px}
  .links a:not(.btn){display:none}
  .menu-btn{display:inline-flex}
  .tags{margin-inline:auto}
  .free{max-width:560px}
}
/* phones */
@media (max-width:600px){
  body{font-size:16px}
  .nav{min-height:60px;padding-block:10px;gap:10px}
  .brand{gap:8px;min-width:0}
  .brand img{width:36px;height:36px}
  .brand b{font-size:17px;white-space:normal;line-height:1.02;max-width:7.5em}
  .links .btn.call{padding:10px 14px}
  .call-full{display:none}
  .call-short{display:inline}
  section{padding-block:60px}
  .head{margin-bottom:32px}
  .hero .lede{font-size:17px}
  .hero .ctas .btn{flex:1 1 auto;justify-content:center}
  .tape{margin-top:44px}
  .field{padding:20px}
  .field .val.email{font-size:clamp(15px,4.4vw,18px)}
  .contact-cta .btn{flex:1 1 auto;justify-content:center}
  .tag{padding:30px 20px 24px}
  .tag h3{font-size:25px}
}
/* small phones (iPhone SE / 320-360px) */
@media (max-width:360px){
  .brand b{font-size:16px}
  .links .btn.call{padding:0;width:44px;height:44px;justify-content:center}
  .call-short{display:none}
  .hero h1{font-size:36px}
}
/* touch screens: bigger tap targets */
@media (pointer:coarse){
  .copy-btn{min-height:40px;padding:8px 16px;font-size:14px}
  .all .chip{padding:11px 14px}
  footer a{display:inline-block;padding-block:8px}
}
/* landscape phones: keep the sticky header short */
@media (max-height:500px) and (orientation:landscape){
  .nav{min-height:52px;padding-block:6px}
  .hero{padding-block:28px 0}
}
/* very wide screens */
@media (min-width:1600px){
  .wrap{max-width:1240px}
  body{font-size:18px}
}
@media (hover:none) and (prefers-reduced-motion:no-preference){
  .tag-hang.is-active{animation:swing 1.1s ease-out both;filter:drop-shadow(0 18px 22px rgba(43,86,114,.22))}
  .tag-hang.is-active::before{transform:scaleY(1)}
  .tag-hang.is-active li::before{background:var(--thread);border-color:var(--thread)}
  .tag-hang.is-active li::after{transform:rotate(45deg) scale(1)}
  .tag-hang.is-active .note::before{width:100%}
  .tag-hang.is-active img{filter:saturate(1.15) contrast(1.05)}
  .tag-hang.is-active li:nth-child(1)::before,.tag-hang.is-active li:nth-child(1)::after{transition-delay:.10s}
  .tag-hang.is-active li:nth-child(2)::before,.tag-hang.is-active li:nth-child(2)::after{transition-delay:.18s}
  .tag-hang.is-active li:nth-child(3)::before,.tag-hang.is-active li:nth-child(3)::after{transition-delay:.26s}
  .tag-hang.is-active li:nth-child(4)::before,.tag-hang.is-active li:nth-child(4)::after{transition-delay:.34s}
  .tag-hang.is-active li:nth-child(5)::before,.tag-hang.is-active li:nth-child(5)::after{transition-delay:.42s}
  .tag-hang.is-active li:nth-child(6)::before,.tag-hang.is-active li:nth-child(6)::after{transition-delay:.50s}
}

/* Gallery lightbox */
.lightbox{padding:0;border:0;background:transparent;max-width:100vw;max-height:100vh;width:100vw;height:100vh;margin:0}
.lightbox[open]{display:grid;place-items:center}
.lightbox::backdrop{background:rgba(12,16,22,.9)}
.lightbox img{max-width:min(92vw,900px);max-height:84vh;width:auto;height:auto;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb-btn{position:fixed;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#141820;font:400 30px/1 var(--body);cursor:pointer;display:grid;place-items:center}
.lb-btn:hover{background:#fff}
.lb-close{top:max(16px, env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px))}
.lb-prev{left:max(16px, env(safe-area-inset-left,0px));top:50%;margin-top:-24px}
.lb-next{right:max(16px, env(safe-area-inset-right,0px));top:50%;margin-top:-24px}
.lb-count{position:fixed;bottom:max(18px, env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font:700 13px/1 var(--mono);letter-spacing:.14em;margin:0}
@media (max-width:600px){.lb-prev,.lb-next{top:auto;bottom:max(10px, env(safe-area-inset-bottom,0px));margin-top:0}.lb-count{bottom:max(26px, env(safe-area-inset-bottom,0px))}}
</style>

<body>
